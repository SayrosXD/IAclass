<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeuroClass Attention Tracking</title>
  <style>
    body{
      margin:0;
      background:#050505;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      min-height:100vh;
      overflow:hidden;
      font-family:Arial, sans-serif;
      color:white;
      gap:16px;
    }

    .wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
      width:min(95vw, 900px);
    }

    .topbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
    }

    button{
      background:#00ffaa;
      color:#000;
      border:none;
      padding:12px 18px;
      border-radius:12px;
      font-weight:700;
      cursor:pointer;
      transition:transform .15s ease, opacity .15s ease;
    }

    button:hover{
      transform:scale(1.03);
    }

    button:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .status{
      background:#101010;
      border:1px solid rgba(0,255,170,.35);
      border-radius:16px;
      padding:14px 18px;
      width:min(95vw, 900px);
      box-sizing:border-box;
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:10px;
    }

    .card{
      background:#0b0b0b;
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      padding:12px 14px;
    }

    .label{
      font-size:12px;
      letter-spacing:.08em;
      opacity:.72;
      margin-bottom:6px;
      text-transform:uppercase;
    }

    .value{
      font-size:22px;
      font-weight:800;
      color:#00ffaa;
      word-break:break-word;
    }

    .value.small{
      font-size:16px;
      color:#e9e9e9;
      font-weight:700;
    }

    .container{
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
      width:100%;
    }

    canvas{
      border-radius:20px;
      max-width:95vw;
      max-height:72vh;
      box-shadow:0 20px 60px rgba(0,0,0,.55);
      background:#000;
    }

    video{
      display:none;
    }

    .hint{
      color:#b6b6b6;
      font-size:14px;
      text-align:center;
      line-height:1.4;
      max-width:820px;
    }

    .calibrating{
      color:#ffd166 !important;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="topbar">
      <button id="calibrateBtn">Calibrar mirada neutral</button>
      <button id="resetBtn">Resetear calibración</button>
    </div>

    <div class="hint" id="hint">
      Mira al centro de la pantalla y presiona calibrar. Después de eso, la métrica será mucho más precisa.
    </div>

    <div class="container">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="status">
      <div class="card">
        <div class="label">Estado</div>
        <div class="value" id="stateText">Inicializando...</div>
      </div>
      <div class="card">
        <div class="label">Attention Score</div>
        <div class="value" id="attentionText">0%</div>
      </div>
      <div class="card">
        <div class="label">Yaw / Horizontal</div>
        <div class="value small" id="yawText">0.000</div>
      </div>
      <div class="card">
        <div class="label">Pitch / Vertical</div>
        <div class="value small" id="pitchText">0.000</div>
      </div>
      <div class="card">
        <div class="label">Eye Openness</div>
        <div class="value small" id="eyeText">0.000</div>
      </div>
      <div class="card">
        <div class="label">Calibration</div>
        <div class="value small" id="calibText">Not calibrated</div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const calibrateBtn = document.getElementById("calibrateBtn");
    const resetBtn = document.getElementById("resetBtn");
    const hint = document.getElementById("hint");

    const stateText = document.getElementById("stateText");
    const attentionText = document.getElementById("attentionText");
    const yawText = document.getElementById("yawText");
    const pitchText = document.getElementById("pitchText");
    const eyeText = document.getElementById("eyeText");
    const calibText = document.getElementById("calibText");

    let faceLandmarker;
    let animationFrameId;

    let calibration = {
      ready: false,
      yaw: 0,
      pitch: 0,
      eyeOpen: 0
    };

    let calibrationSamples = [];
    let calibrating = false;

    let smoothAttention = 0;
    let smoothYaw = 0;
    let smoothPitch = 0;
    let smoothEye = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function avg(values) {
      if (!values.length) return 0;
      return values.reduce((a, b) => a + b, 0) / values.length;
    }

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    function getMetrics(landmarks) {
      // Índices usados frecuentemente en Face Mesh / Face Landmarker
      const leftEyeOuter = landmarks[33];
      const rightEyeOuter = landmarks[263];
      const leftEyeTop = landmarks[159];
      const leftEyeBottom = landmarks[145];
      const rightEyeTop = landmarks[386];
      const rightEyeBottom = landmarks[374];
      const noseTip = landmarks[1];
      const mouthLeft = landmarks[61];
      const mouthRight = landmarks[291];

      const eyeCenterX = (leftEyeOuter.x + rightEyeOuter.x) / 2;
      const eyeCenterY = (leftEyeOuter.y + rightEyeOuter.y) / 2;
      const mouthCenterY = (mouthLeft.y + mouthRight.y) / 2;

      const eyeSpanX = Math.max(0.0001, Math.abs(rightEyeOuter.x - leftEyeOuter.x));
      const faceHeight = Math.max(0.0001, Math.abs(mouthCenterY - eyeCenterY));

      // Desviación horizontal de la nariz con respecto al centro de los ojos
      const yaw = (noseTip.x - eyeCenterX) / eyeSpanX;

      // Desviación vertical de la nariz entre ojos y boca
      const pitch = (noseTip.y - eyeCenterY) / faceHeight;

      // Apertura ocular aproximada
      const leftEyeOpen = dist(leftEyeTop, leftEyeBottom) / Math.max(0.0001, dist(leftEyeOuter, landmarks[133]));
      const rightEyeOpen = dist(rightEyeTop, rightEyeBottom) / Math.max(0.0001, dist(rightEyeOuter, landmarks[362]));
      const eyeOpen = (leftEyeOpen + rightEyeOpen) / 2;

      // Inclinación leve de la cabeza
      const headTilt = Math.atan2(
        rightEyeOuter.y - leftEyeOuter.y,
        rightEyeOuter.x - leftEyeOuter.x
      ) * (180 / Math.PI);

      return {
        yaw,
        pitch,
        eyeOpen,
        headTilt
      };
    }

    function scoreAttention(metrics) {
      if (!calibration.ready) {
        return {
          attention: 0,
          state: "Calibrate first"
        };
      }

      const yawDelta = Math.abs(metrics.yaw - calibration.yaw);
      const pitchDelta = Math.abs(metrics.pitch - calibration.pitch);
      const eyeDelta = Math.max(0, calibration.eyeOpen - metrics.eyeOpen);

      // Penalizaciones ponderadas.
      // Ajustadas para que no sea binario y sí más fino.
      const yawPenalty = clamp(yawDelta * 220, 0, 38);
      const pitchPenalty = clamp(pitchDelta * 210, 0, 34);
      const eyePenalty = clamp(eyeDelta * 240, 0, 20);
      const tiltPenalty = clamp(Math.abs(metrics.headTilt) * 0.9, 0, 8);

      let attention = 100 - (yawPenalty + pitchPenalty + eyePenalty + tiltPenalty);

      // Suavizado para evitar saltos bruscos
      smoothAttention = smoothAttention === 0 ? attention : (smoothAttention * 0.82 + attention * 0.18);
      attention = clamp(Math.round(smoothAttention), 0, 100);

      let state = "Focused";
      if (attention >= 85) state = "Highly focused";
      else if (attention >= 70) state = "Focused";
      else if (attention >= 55) state = "Slightly distracted";
      else if (attention >= 35) state = "Distracted";
      else state = "Very distracted";

      // Si mira claramente a otro lado o sube/baja bastante
      if (yawDelta > 0.14 || pitchDelta > 0.12) {
        if (attention >= 70) state = "Attention drifting";
      }

      // Si el ojo está muy cerrado
      if (metrics.eyeOpen < calibration.eyeOpen * 0.72) {
        if (attention > 45) state = "Possible fatigue";
      }

      return { attention, state };
    }

    async function calibrateNeutral() {
      if (!faceLandmarker) return;
      calibrating = true;
      calibrationSamples = [];
      calibText.innerText = "Calibrating...";
      hint.classList.add("calibrating");
      hint.innerText = "Mantén la mirada al centro por 2 segundos para calibrar mejor el modelo.";

      calibrateBtn.disabled = true;

      const start = performance.now();
      while (performance.now() - start < 2000) {
        await new Promise(r => setTimeout(r, 60));

        const result = faceLandmarker.detectForVideo(video, performance.now());
        if (result.faceLandmarks && result.faceLandmarks.length > 0) {
          const metrics = getMetrics(result.faceLandmarks[0]);
          calibrationSamples.push(metrics);
        }
      }

      if (calibrationSamples.length > 0) {
        calibration.yaw = avg(calibrationSamples.map(s => s.yaw));
        calibration.pitch = avg(calibrationSamples.map(s => s.pitch));
        calibration.eyeOpen = avg(calibrationSamples.map(s => s.eyeOpen));
        calibration.ready = true;
        calibText.innerText = "Calibrated";
        hint.innerText = "Calibración lista. Ahora el sistema puede estimar atención con más precisión.";
      } else {
        calibText.innerText = "Calibration failed";
        hint.innerText = "No se detectó un rostro durante la calibración. Intenta de nuevo con mejor iluminación.";
      }

      calibrating = false;
      calibrateBtn.disabled = false;
      hint.classList.remove("calibrating");
    }

    function resetCalibration() {
      calibration = { ready: false, yaw: 0, pitch: 0, eyeOpen: 0 };
      calibrationSamples = [];
      smoothAttention = 0;
      calibText.innerText = "Not calibrated";
      stateText.innerText = "Awaiting calibration";
      attentionText.innerText = "0%";
      yawText.innerText = "0.000";
      pitchText.innerText = "0.000";
      eyeText.innerText = "0.000";
      hint.innerText = "Mira al centro de la pantalla y presiona calibrar.";
    }

    async function init() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      await video.play();

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
        },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: true,
        refineLandmarks: true
      });

      calibrateBtn.addEventListener("click", calibrateNeutral);
      resetBtn.addEventListener("click", resetCalibration);

      function detect() {
        if (video.videoWidth && video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const results = faceLandmarker.detectForVideo(video, performance.now());

        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];

          const drawingUtils = new DrawingUtils(ctx);
          drawingUtils.drawConnectors(
            landmarks,
            FaceLandmarker.FACE_LANDMARKS_TESSELATION,
            {
              color: "#00FFAA",
              lineWidth: 1
            }
          );

          const metrics = getMetrics(landmarks);
          smoothYaw = smoothYaw === 0 ? metrics.yaw : smoothYaw * 0.85 + metrics.yaw * 0.15;
          smoothPitch = smoothPitch === 0 ? metrics.pitch : smoothPitch * 0.85 + metrics.pitch * 0.15;
          smoothEye = smoothEye === 0 ? metrics.eyeOpen : smoothEye * 0.85 + metrics.eyeOpen * 0.15;

          const { attention, state } = scoreAttention(metrics);

          stateText.innerText = state;
          attentionText.innerText = `${attention}%`;
          yawText.innerText = smoothYaw.toFixed(4);
          pitchText.innerText = smoothPitch.toFixed(4);
          eyeText.innerText = smoothEye.toFixed(4);

          if (!calibration.ready) {
            stateText.innerText = "Need calibration";
            attentionText.innerText = "0%";
          }
        } else {
          stateText.innerText = "No Face Detected";
          attentionText.innerText = "0%";
          yawText.innerText = "0.000";
          pitchText.innerText = "0.000";
          eyeText.innerText = "0.000";
        }

        animationFrameId = requestAnimationFrame(detect);
      }

      detect();
    }

    init();
  </script>
</body>
</html>
